plugins {
    id "com.android.application"
}

android {
    namespace "net.sybyline.scarlet.companion"
    compileSdk 35

    defaultConfig {
        applicationId "net.sybyline.scarlet.companion"
        minSdk 26
        targetSdk 35
        // Bumped alongside the desktop 0.4.18-b2 notification fixes. The companion's read
        // timeout and reconnect changes only work against a desktop that sends heartbeats,
        // so being able to tell an updated phone from a stale one matters when someone
        // reports that alerts still are not arriving.
        versionCode 4
        versionName "0.4.18-b2"
    }
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}
