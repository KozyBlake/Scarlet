name: Build Scarlet JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'libdave-maven/**'
      - '.github/workflows/build-scarlet.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and install vendored libdave
        working-directory: libdave-maven
        run: mvn -B clean install

      - name: Build Scarlet
        run: mvn -B clean package

      - name: Upload Scarlet JAR
        uses: actions/upload-artifact@v4
        with:
          name: Scarlet-Desktop
          path: |
            target/scarlet-*.jar
            !target/scarlet-*-debug.jar
            !target/scarlet-*-android.jar
          if-no-files-found: error
          retention-days: 30
