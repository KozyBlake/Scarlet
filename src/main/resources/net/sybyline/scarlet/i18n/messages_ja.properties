ui.multiGroupWarn=<html><body style='width:430px'><b>マルチグループモードは実験的機能です</b> — 1つのScarletで複数のVRChatグループを同時にモデレートします。有効にする前に確認してください:<br><br>&bull; 反映には<b>再起動が必要</b>です。<br>&bull; <b>すべてのグループが1つのVRChatアカウント</b>を使い、そのAPIレート制限を共有します。グループが多いほどイベントの到着が遅くなります。遅い場合はグループごとの監査ポーリング間隔を長くしてください。<br>&bull; <b>各グループに専用のDiscordボットトークンが必要</b>です（Discordはトークンごとに1接続のみ）。<br>&bull; 各グループは現在<b>個別のウィンドウ</b>で開きます（統合タブ表示は未完成）。<br>&bull; 現在のグループはメインのデータフォルダからそのまま動作します。追加のグループは<code>groups</code>フォルダのサブフォルダとして追加してください。<br>&bull; グループごとの別アカウントや共有ボットは<b>まだ未完成</b>です。<br><br>マルチグループモードを有効にしますか？</body></html>
